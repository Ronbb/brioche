http:
  routers:
    api:
      entryPoints: [web]
      rule: "Path(`/api`) || PathPrefix(`/api/`)"
      priority: 100
      service: api
    web:
      entryPoints: [web]
      rule: "PathPrefix(`/`)"
      priority: 1
      service: web
      middlewares: [compress]
  services:
    api:
      loadBalancer:
        servers:
          - url: http://server:3001
    web:
      loadBalancer:
        servers:
          - url: http://web:3000
  middlewares:
    compress:
      compress: {}
