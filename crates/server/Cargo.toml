[package]
name = "brioche-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[dependencies]
jiff = { version = "0.2.37", features = ["tzdb-bundle-always"] }
brioche-course-contract = { path = "../course-contract" }
brioche-migration = { path = "../migration" }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1.20"
tokio.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
axum = "0.8.9"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
unicode-normalization = "0.1.25"
axum-login = "0.18.0"
tower-sessions = { version = "0.14.0", default-features = false, features = ["axum-core"] }
async-trait = "0.1"
time = { version = "0.3", features = ["serde"] }
sha2 = "0.10"
getrandom = "0.4.3"
subtle = "2.6"
url = "2.5"
argon2 = { version = "0.6.0", features = ["getrandom"] }
quick-xml = "0.42.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
