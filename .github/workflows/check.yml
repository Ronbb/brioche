name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: brioche_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d brioche_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install -g pnpm@11.11.0
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path framework/Cargo.toml --all --check
      - run: cargo test --manifest-path framework/Cargo.toml --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust workspace tests
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/brioche-rust-tests.log"
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/brioche-rust-tests.log" <<'PY'
          import pathlib
          import sys

          # Expose bounded test names and panic locations through check annotations.
          # Assertion values and arbitrary log lines remain in the normal job log.
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          failures = [line for line in lines if
                      (line.startswith("test ") and line.endswith(" ... FAILED")) or
                      (line.startswith("thread '") and "panicked at " in line) or
                      line.startswith("error: could not compile")]
          if not failures:
              failures = ["Rust tests failed; inspect the job log for build or process errors."]
          for line in failures[:20]:
              message = line[:600].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Rust workspace tests::{message}")
          PY
          fi
          exit "$test_status"
      - run: cargo run -p brioche-server --locked -- check curriculum/docs/examples/a1-bakery.lesson.json
      - run: cargo run -p brioche-server --locked -- check-release curriculum/docs/examples/catalog.release.json
      - run: node framework/scripts/check-curriculum.mjs target/debug/brioche-server curriculum/docs/content/releases/audio-forty-eight.release.json curriculum/docs/content curriculum/docs/examples
      - run: cargo test --manifest-path framework/Cargo.toml -p chef-engine --test postgres --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: cargo test --manifest-path framework/Cargo.toml -p chef-engine --test identity --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: cargo test --manifest-path framework/Cargo.toml -p chef-engine --test learning --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: cargo test --manifest-path framework/Cargo.toml -p chef-engine --test recording --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: cargo test --manifest-path framework/Cargo.toml -p chef-engine --test author_runtime --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: cargo test --manifest-path framework/Cargo.toml -p chef-engine --test admin --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: pnpm contracts
      - run: git -C framework diff --exit-code -- packages/contracts/src/generated
      - run: git diff --exit-code -- docs/generated
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: python3 -m unittest discover -s framework/scripts/alignment -p test_align.py -v
      - run: pnpm test:ops
        env:
          BRIOCHE_BACKUP_DOCKER_TEST: "1"
      - run: node --test scripts/compat.test.mjs
      - run: pnpm build
      - run: pnpm test:ssr
      - run: pnpm exec agent-browser install --with-deps
      - run: pnpm test:browser
      - run: pnpm test:browser:ssr
