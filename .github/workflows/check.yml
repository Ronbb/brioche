name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: brioche_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d brioche_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
      - run: npm install -g pnpm@11.11.0
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p brioche-server --test postgres --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: pnpm contracts
      - run: git diff --exit-code -- packages/contracts/src/generated
      - run: pnpm typecheck
      - run: pnpm build
