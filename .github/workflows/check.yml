name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: brioche_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d brioche_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install -g pnpm@11.11.0
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p brioche-server --locked -- check docs/examples/a1-bakery.lesson.json
      - run: cargo run -p brioche-server --locked -- check-release docs/examples/catalog.release.json
      - run: cargo test -p brioche-server --test postgres --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: cargo test -p brioche-server --test identity --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: cargo test -p brioche-server --test learning --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: cargo test -p brioche-server --test recording --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: cargo test -p brioche-server --test author_runtime --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: cargo test -p brioche-server --test admin --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/brioche_test
      - run: pnpm contracts
      - run: git diff --exit-code -- packages/contracts/src/generated docs/generated
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm test:ops
        env:
          BRIOCHE_BACKUP_DOCKER_TEST: "1"
      - run: pnpm build
      - run: pnpm test:ssr
      - run: pnpm exec agent-browser install --with-deps
      - run: pnpm test:browser
      - run: pnpm test:browser:ssr
