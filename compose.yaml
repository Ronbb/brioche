name: brioche
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: brioche
      POSTGRES_USER: brioche
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U brioche -d brioche"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: brioche-api:local
    build: { context: ., dockerfile: infra/Dockerfile.api }
    command: [migrate]
    environment:
      DATABASE_URL: postgres://brioche:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/brioche
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database]
    restart: "no"
  server:
    image: brioche-api:local
    build: { context: ., dockerfile: infra/Dockerfile.api }
    environment:
      APP_ENV: production
      CONTENT_MODE: database
      DATABASE_URL: postgres://brioche:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/brioche
      API_BIND: 0.0.0.0:3001
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [app, database]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:3001/api/ready]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: infra/Dockerfile.web }
    environment:
      INTERNAL_API_URL: http://server:3001
    depends_on:
      server: { condition: service_healthy }
    networks: [app]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  caddy:
    build: { context: ., dockerfile: infra/Dockerfile.caddy }
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    volumes:
      [
        ./infra/Caddyfile:/etc/caddy/Caddyfile:ro,
        caddy_data:/data,
        caddy_config:/config,
      ]
    depends_on:
      web: { condition: service_healthy }
    networks: [app]
    restart: unless-stopped
networks:
  app:
  database:
    internal: true
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
